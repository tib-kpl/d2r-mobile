name: Android build and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      commit: ${{ github.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Determine Android release version
        id: version
        run: |
          python -m unittest discover -s ci -p 'test_*.py'
          python ci/version.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.31.6'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dm-ffmpeg
          key: ffmpeg-android-r29-${{ runner.os }}-${{ hashFiles('dm/android/tools/build_ffmpeg.sh') }}
      - name: Build shared VP8 decoder
        run: bash dm/android/tools/build_ffmpeg.sh "$RUNNER_TEMP/dm-ffmpeg" "$ANDROID_HOME/ndk/29.0.14206865"
      - name: Test movie decoding with synthetic video
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
          make -C dm/host/tests movie-real PY=python3
      - name: Validate localization and generate content-free shell
        run: |
          python dm/ios/tools/dm_i18n.py --check
          python dm/i18n/scan_literals.py
          python dm/ios/tests/test_touch_layout_language.py
          python -m unittest discover -s dm/android/tests -p 'test_*.py'
          cc -O1 -std=gnu17 -Wno-unused-function -I dm/android/compat/include -I dm/host dm/host/tests/t_fs_no_xattr.c dm/host/dm_i18n.c -pthread -o "$RUNNER_TEMP/t_fs_no_xattr"
          "$RUNNER_TEMP/t_fs_no_xattr"
          javac -d "$RUNNER_TEMP/path-tests" dm/android/app/src/main/java/com/xiaoboluo/d2r/GamePaths.java dm/android/tests/GamePathsTest.java
          java -cp "$RUNNER_TEMP/path-tests" com.xiaoboluo.d2r.GamePathsTest
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -I dm/android/compat/include -I dm/host dm/host/tests/t_i18n.c dm/host/dm_i18n.c -o "$RUNNER_TEMP/t_i18n"
          for mode in en zh none sysen syses systw sysru sysko sysfr tags game; do "$RUNNER_TEMP/t_i18n" "$mode"; done
          python dm/android/tools/ci_shell.py "$RUNNER_TEMP/dm-gen"
      - name: Restore release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in repository secrets.' >&2; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.p12"
      - name: Build signed APK and lint
        if: github.event_name != 'pull_request'
        env:
          DM_ANDROID_KEYSTORE: ${{ runner.temp }}/release.p12
          DM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DM_ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon -p dm/android :app:assembleRelease :app:lintRelease \
            -PdmGenDir="$RUNNER_TEMP/dm-gen" -PdmPython="$(command -v python)" \
            -PdmFfmpegDir="$RUNNER_TEMP/dm-ffmpeg/out" \
            -PdmVersionCode="${{ steps.version.outputs.code }}" \
            -PdmVersionName="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp dm/android/app/build/outputs/apk/release/app-release.apk dist/D2RMobile-android.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify dist/D2RMobile-android.apk
          python dm/android/tools/check_shell_apk.py dist/D2RMobile-android.apk --require-movies
          cp "$RUNNER_TEMP/dm-ffmpeg/source/ffmpeg-9.0.2-git.tar.gz" dist/
          cp "$RUNNER_TEMP/dm-ffmpeg/out/config.mak" dist/ffmpeg-build-config.txt
          cp "$RUNNER_TEMP/dm-ffmpeg/out/COPYING.LGPLv2.1" dist/FFmpeg-LGPL-2.1.txt
          (cd dist && sha256sum D2RMobile-android.apk ffmpeg-* FFmpeg-* > SHA256SUMS)
      - name: Build pull request without signing secrets
        if: github.event_name == 'pull_request'
        run: |
          gradle --no-daemon -p dm/android :app:assembleDebug :app:lintDebug \
            -PdmGenDir="$RUNNER_TEMP/dm-gen" -PdmPython="$(command -v python)" \
            -PdmFfmpegDir="$RUNNER_TEMP/dm-ffmpeg/out" \
            -PdmVersionCode="${{ steps.version.outputs.code }}" \
            -PdmVersionName="${{ steps.version.outputs.version }}"
          python dm/android/tools/check_shell_apk.py dm/android/app/build/outputs/apk/debug/app-debug.apk --require-movies
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: android-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request'
    needs: android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-${{ needs.android.outputs.commit }}
          path: dist
      - name: Publish one release per pushed commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.android.outputs.commit }}
          VERSION: ${{ needs.android.outputs.version }}
          TAG: ${{ needs.android.outputs.tag }}
        run: |
          tag="$TAG"
          printf 'Android %s\n\nInstall D2RMobile-android.apk and prepare your own game pack from the source archive of this exact tag. Choose its folder in the app; files are read in place. Game content is not included. French text and French voices are supported when the corresponding audio archives are present.\n\nSwitch 1.0.33 uses the original controller UI; 1.0.34 retains touch controls. See docs/ANDROID.fr.md for installation and limitations.\n\nVP8 movie playback uses shared FFmpeg libraries (LGPL-2.1-or-later). Corresponding source, license and build configuration are attached.\n\nSource commit: `%s`.\n' "$VERSION" "$COMMIT" > notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            existing_commit=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)
            test "$existing_commit" = "$COMMIT" || { echo "Refusing to replace a version assigned to another commit" >&2; exit 1; }
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "Android $VERSION" --notes-file notes.md --prerelease=false --latest
          else
            gh release create "$tag" dist/* --target "$COMMIT" \
              --title "Android $VERSION" --notes-file notes.md --latest
          fi
